<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Posição não encontrada · Ale light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ficha de prateleira — etiqueta de posição no topo, nome, specs em grade 2 col, blocos de compatibilidade/estoque/cuidados */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --fg:#16191d; --muted:#5c6470; --line:#dde1e6;
  --accent:#e0a100; --accent-ink:#1a1400; --ok:#1f7a4a; --warn:#b4540a; --chip:#eceff3;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1f25; --fg:#eef1f4; --muted:#9aa4b1; --line:#2b323b;
  --accent:#f2b51d; --accent-ink:#1a1400; --ok:#4cc184; --warn:#f0954a; --chip:#232a32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1f25; --fg:#eef1f4; --muted:#9aa4b1; --line:#2b323b;
  --accent:#f2b51d; --accent-ink:#1a1400; --ok:#4cc184; --warn:#f0954a; --chip:#232a32; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.demo{font:500 12px/1.3 var(--f-mono);color:var(--muted);text-align:center;letter-spacing:.04em}
.tag{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.tag .pos{background:var(--accent);color:var(--accent-ink);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tag .pos small{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.tag .pos b{font:700 26px/1.05 var(--f-display);letter-spacing:.02em}
.tag .where{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.tag .where span{font-size:13px;color:var(--muted)}
.tag .where strong{font-weight:600}
h1{font:700 clamp(30px,8vw,40px)/1.02 var(--f-display);margin:6px 0 0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.hi{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:0}
.specs div{min-width:0}
.specs dt{font-size:12px;color:var(--muted)}
.specs dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:14px}
.compat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.compat li{display:flex;gap:10px;align-items:baseline}
.compat li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--ok);transform:translateY(-1px)}
.compat li.no::before{background:var(--warn)}
.stock{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stock .n{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stock .n small{font:500 15px var(--f-body);color:var(--muted);margin-left:4px}
.badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid currentColor}
.badge.ok{color:var(--ok)} .badge.low{color:var(--warn)}
.note{display:flex;gap:10px;border-left:3px solid var(--warn);padding:2px 0 2px 12px}
.note p{margin:0}
.draw{color:var(--muted);overflow-x:auto}
.draw svg{display:block;width:100%;height:auto;max-width:520px}
.lock{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:10px}
footer{font-size:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:2px;margin-top:6px}
footer .mono{font-size:12px}
</style>
<main class="wrap"><div class="demo">DEMONSTRAÇÃO · DADOS FICTÍCIOS</div><h1>Posição não encontrada</h1><p class="sub">Essa etiqueta não corresponde a nenhuma posição cadastrada.</p><a href="/alelight-etiquetas/" style="color:inherit;font-weight:600">Ver todas as posições</a></main>
</body></html>
